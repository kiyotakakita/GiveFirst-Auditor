# 自社の提供価値（Value Proposition）
service:
  name: "中小企業向けAI導入・業務自動化スターター支援"
  target_maturity: "AI未導入・PC操作はできるが何から始めていいか分からない初級〜中級層"
  core_value: "現場のPC環境に合わせた無料/安価なツールの選定、社内ルール作り、プロンプト雛形の提供"
  anti_targets:
    - "AI・機械学習の第一線研究者やトップエンジニア"
    - "既に自社専任のAI/データ分析チームを抱える大企業"
    - "自作ツールや論文を公開している有識者"

# 判定とアクションの基準
criteria:
  danger_definition: "相手が自社より遥かに高い専門性を持ち、自社の初歩的提案が失礼・スパム・炎上につながる状態"
  safe_definition: "相手が課題を抱えており、自社の提供価値（Can）が相手の困りごと（Want）を救える状態"
